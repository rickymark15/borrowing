  <!-- Hexagon honeycomb badge -->
  <path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z" fill="url(#hb-grad)" stroke="#132a24" stroke-width="2.5" stroke-linejoin="round"/>
